# Output contract of the prepare_leadouts_data ETL job: the dataset it writes. Generation-time input;
# never deployed. Fill in every value shaped like <...>.
contract:
  layer: preprocessed
  dataset: prepared_leadouts_data
  grain:
    unique_key: [click_id]    # checked for duplicates on every write
  schema:
    - name: click_id
      type: string
      nullable: false
    - name: type
      type: string
      nullable: true
    - name: price
      type: decimal(10,2)
      nullable: true
    - name: shop_id
      type: int
      nullable: false
    - name: date_utc
      type: date
      nullable: false