# tf-setup -- generated by pipeline-automator scaffold (project init)
# Bundles the setup every Terraform-touching job repeats: optional OIDC
# credentials, the Terraform install, and `terraform init`. The calling job
# must run actions/checkout *before* `uses: ./.github/actions/tf-setup` -- a
# local composite action is only resolvable once its own repository is on disk,
# so checkout cannot live inside it.
#
# Credential-free callers (fmt/validate) pass no `aws-role` and set
# `backend: "false"`; role-assuming callers pass an `aws-role` and leave
# `backend` at its "true" default.
name: "Terraform setup"
description: "Optional AWS credentials, Terraform install, and terraform init."

inputs:
  aws-role:
    description: "IAM role ARN to assume via OIDC. Empty skips credential configuration."
    required: false
    default: ""
  aws-region:
    description: "AWS region for the assumed-role session; the caller supplies it from the AWS_REGION repo variable."
    required: false
    default: ""
  backend:
    description: "'true' initialises the S3 backend; 'false' runs init -backend=false."
    required: false
    default: "true"
  terraform-version:
    description: "Terraform version to install."
    required: false
    default: "1.10"
  working-directory:
    description: "Terraform root passed to terraform init."
    required: false
    default: "infra/terraform"

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      if: ${{ inputs.aws-role != '' }}
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ inputs.aws-region }}

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Terraform init (backend)
      if: ${{ inputs.backend == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init

    - name: Terraform init (no backend)
      if: ${{ inputs.backend != 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -backend=false
