# ci.yml -- generated by pipeline-automator scaffold (project init)
# CI/CD for the leadouts_test data pipeline. On every push and pull request
# to the default branch it runs quality gates, a credential-free Terraform
# validate, and a read-only `terraform plan`. On a push to the default branch it
# also gates a `terraform apply` behind the dev
# GitHub Environment (required-reviewers pause) and then uploads the shared code
# zip and each job script to S3.
#
# Required repo configuration (see README):
#   - a "dev" Environment with a required reviewer
#   - secrets AWS_PLAN_ROLE_ARN, AWS_DEPLOY_ROLE_ARN, AWS_SCRIPTS_ROLE_ARN
#     (populated from the infra/terraform/bootstrap outputs)
#   - variable AWS_REGION -- the region CI assumes its roles in / deploys to
name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# No id-token here: only plan/apply/deploy may mint an OIDC token, and they
# request it per job. Everything else runs with read-only contents access.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Single source for the AWS region every role assumption uses; set it as an
  # Actions repository variable (Settings -> Secrets and variables -> Actions).
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_INPUT: "false"
  TF_CLI_ARGS: "-no-color"

jobs:
  quality:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/

      - name: Tests (pytest)
        run: pytest tests/unit tests/integration tests/end_to_end --cov=src --cov-report=term-missing

      - name: Build shared package zip (validation only)
        run: |
          mkdir -p lib
          rm -f lib/leadouts_test.zip
          cd src && find leadouts_test -type f \
            -not -path '*/__pycache__/*' \
            -not -path 'leadouts_test/contracts/*' \
            -not \( -path '*/jobs/*' -name '*.yaml' \) \
            | zip -q -X "$GITHUB_WORKSPACE/lib/leadouts_test.zip" -@

  terraform:
    name: Terraform format & validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform setup (no backend, no credentials)
        uses: ./.github/actions/tf-setup
        with:
          backend: "false"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform/

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  plan:
    name: Terraform plan
    needs: [quality, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform setup
        uses: ./.github/actions/tf-setup
        with:
          aws-role: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          backend: "true"

      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan -out=tfplan

      - name: Render plan text
        working-directory: infra/terraform
        run: terraform show -no-color tfplan > plan.txt

      - name: Comment plan on the pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
            const clipped = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan;
            const body = "#### Terraform Plan\n```\n" + clipped + "\n```";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload plan artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: infra/terraform/tfplan
          retention-days: 1

  apply:
    name: Terraform apply
    needs: plan
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      scripts_bucket: ${{ steps.tf_output.outputs.scripts_bucket }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform setup
        uses: ./.github/actions/tf-setup
        with:
          aws-role: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          backend: "true"

      - name: Download plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan
          path: infra/terraform

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Export scripts bucket
        id: tf_output
        working-directory: infra/terraform
        run: echo "scripts_bucket=$(terraform output -raw scripts_bucket)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build & upload job scripts
    needs: apply
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_SCRIPTS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build shared package zip
        run: |
          mkdir -p lib
          rm -f lib/leadouts_test.zip
          cd src && find leadouts_test -type f \
            -not -path '*/__pycache__/*' \
            -not -path 'leadouts_test/contracts/*' \
            -not \( -path '*/jobs/*' -name '*.yaml' \) \
            | zip -q -X "$GITHUB_WORKSPACE/lib/leadouts_test.zip" -@

      - name: Upload shared package zip
        env:
          SCRIPTS_BUCKET: ${{ needs.apply.outputs.scripts_bucket }}
        run: aws s3 cp "lib/leadouts_test.zip" "s3://$SCRIPTS_BUCKET/lib/leadouts_test.zip"

      - name: Upload job scripts
        env:
          SCRIPTS_BUCKET: ${{ needs.apply.outputs.scripts_bucket }}
        run: |
          for job_dir in src/leadouts_test/jobs/*/; do
            job_name=$(basename "$job_dir")
            aws s3 cp "${job_dir}${job_name}.py" \
              "s3://$SCRIPTS_BUCKET/scripts/${job_name}/${job_name}.py"
          done
